# Typecheck, unit + IPC contract tests, and the Electron smoke test (every
# view opened in the real app, on a virtual display). Runs on every push and
# pull request, and the release workflow calls it first, so installers are
# only built from a commit that passes.

name: test

# Pushes run it on main only: a branch with a pull request is covered by the
# pull_request run, so it is no longer tested twice per push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# A newer push to the same branch or pull request replaces the run in progress.
# A release calls this with its tag as the ref, so it never shares a group
# with a branch run.
concurrency:
  group: test-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The app depends on the engine as file:../ArcFlare-Code, so check both
      # out side by side, like a local setup.
      - uses: actions/checkout@v4
        with:
          path: ArcFlare-Desktop
      - uses: actions/checkout@v4
        with:
          repository: Hakeperty/ArcFlare-Code
          path: ArcFlare-Code

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ArcFlare-Desktop/package-lock.json

      # npm ci downloads the Electron binary (about 100 MB) unless it is here.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('ArcFlare-Desktop/package-lock.json') }}

      - name: Install
        working-directory: ArcFlare-Desktop
        run: npm ci

      - name: Typecheck
        working-directory: ArcFlare-Desktop
        run: npm run typecheck

      - name: Unit and contract tests
        working-directory: ArcFlare-Desktop
        run: npm test

      - name: Smoke test (every view, real app)
        working-directory: ArcFlare-Desktop
        run: xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" npm run test:smoke
