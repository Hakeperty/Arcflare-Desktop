# Builds the installers on each OS and attaches them to a GitHub release.
# Push a tag like v0.1.0 (or run it by hand) and the release appears with:
#   ArcFlare-Setup-x64.exe · ArcFlare-mac-arm64.dmg · ArcFlare-mac-x64.dmg
#   ArcFlare-linux-x86_64.AppImage · ArcFlare-linux-amd64.deb
#   ArcFlare-linux-arm64.AppImage · ArcFlare-linux-arm64.deb (ARM Linux: DGX Spark, Jetson, Raspberry Pi 5,
#   ARM laptops). Both Linux architectures are built on the one x64 runner: the app has no native modules.
#   ArcFlare-linux-x64.pacman · ArcFlare-linux-aarch64.pacman for Arch, and SHA256SUMS for all of them,
#   which arcflare.net/install-desktop.sh checks every download against.
# Names carry no version, so /releases/latest/download/<name> is a stable link
# the website can point at.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Nothing is released unless typecheck, unit, contract and smoke tests pass
  # on this commit. The installers build at the same time as the tests run
  # (they take longer), and the release job below waits for both.
  test:
    uses: ./.github/workflows/test.yml

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      # The app depends on the engine as file:../ArcFlare-Code, so check both
      # out side by side, exactly like a local setup.
      - uses: actions/checkout@v4
        with:
          path: ArcFlare-Desktop
      - uses: actions/checkout@v4
        with:
          repository: Hakeperty/ArcFlare-Code
          path: ArcFlare-Code

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ArcFlare-Desktop/package-lock.json

      - name: Install
        working-directory: ArcFlare-Desktop
        run: npm ci

      # electron-builder's pacman target packs with bsdtar, which the Ubuntu runner does not have.
      - name: Tools for the Arch package
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Build installers
        working-directory: ArcFlare-Desktop
        env:
          # Unsigned for now: no certificates in CI.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx vite build && npx electron-builder ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            ArcFlare-Desktop/release/*.exe
            ArcFlare-Desktop/release/*.dmg
            ArcFlare-Desktop/release/*.AppImage
            ArcFlare-Desktop/release/*.deb
            ArcFlare-Desktop/release/*.pacman
            ArcFlare-Desktop/release/*.blockmap
            ArcFlare-Desktop/release/latest*.yml
          if-no-files-found: error

  release:
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      # The website's installer refuses a download that does not match this list, and warns when there is none.
      - name: Checksums
        working-directory: out
        run: |
          shopt -s nullglob
          sha256sum *.exe *.dmg *.AppImage *.deb *.pacman > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          body: |
            Download the file for your system:

            | System | File |
            |---|---|
            | Windows 10/11 | `ArcFlare-Setup-x64.exe` |
            | macOS, Apple silicon | `ArcFlare-mac-arm64.dmg` |
            | macOS, Intel | `ArcFlare-mac-x64.dmg` |
            | Linux (any), x86_64 | `ArcFlare-linux-x86_64.AppImage` |
            | Debian / Ubuntu, x86_64 | `ArcFlare-linux-amd64.deb` |
            | Linux (any), ARM64 | `ArcFlare-linux-arm64.AppImage` |
            | Debian / Ubuntu, ARM64 | `ArcFlare-linux-arm64.deb` |
            | Arch, x86_64 | `ArcFlare-linux-x64.pacman` |
            | Arch, ARM64 | `ArcFlare-linux-aarch64.pacman` |

            Or on Linux and macOS: `curl -fsSL https://arcflare.net/install-desktop.sh | sh` picks the right file,
            checks it against `SHA256SUMS`, and installs it.

            The builds are not code-signed yet. On Windows, choose **More info → Run anyway** in SmartScreen.
            On macOS, right-click the app and choose **Open** the first time.
